name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - 'cursor/**'
  pull_request:
    branches:
      - main

env:
  PACKAGE_NAME: moe-playground
  OCTOPUS_SERVER: ${{ secrets.OCTOPUS_SERVER }}
  OCTOPUS_API_KEY: ${{ secrets.OCTOPUS_API_KEY }}
  OCTOPUS_SPACE: ${{ secrets.OCTOPUS_SPACE }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linting
        run: npm run lint

      - name: Run tests
        run: npm run test:run

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Get version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "artifact_name=${{ env.PACKAGE_NAME }}.$VERSION.zip" >> $GITHUB_OUTPUT

      - name: Create artifact zip
        run: |
          cd dist
          zip -r ../${{ steps.version.outputs.artifact_name }} .
          cd ..

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE_NAME }}
          path: ${{ steps.version.outputs.artifact_name }}

  deploy-octopus:
    name: Deploy to Octopus
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/cursor/')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.PACKAGE_NAME }}

      - name: Get version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "artifact_name=${{ env.PACKAGE_NAME }}.$VERSION.zip" >> $GITHUB_OUTPUT

      - name: Install Octopus CLI
        uses: OctopusDeploy/install-octopus-cli-action@v3
        with:
          version: latest

      - name: Push package to Octopus
        run: |
          octopus package upload \
            --package=${{ steps.version.outputs.artifact_name }} \
            --server=${{ env.OCTOPUS_SERVER }} \
            --apiKey=${{ env.OCTOPUS_API_KEY }} \
            --space=${{ env.OCTOPUS_SPACE }}

      - name: Create Octopus release
        run: |
          octopus release create \
            --project=${{ env.PACKAGE_NAME }} \
            --version=${{ steps.version.outputs.version }} \
            --package=${{ env.PACKAGE_NAME }}:${{ steps.version.outputs.version }} \
            --server=${{ env.OCTOPUS_SERVER }} \
            --apiKey=${{ env.OCTOPUS_API_KEY }} \
            --space=${{ env.OCTOPUS_SPACE }}

      - name: Deploy to Dev
        run: |
          octopus release deploy \
            --project=${{ env.PACKAGE_NAME }} \
            --version=${{ steps.version.outputs.version }} \
            --deployTo=Dev \
            --server=${{ env.OCTOPUS_SERVER }} \
            --apiKey=${{ env.OCTOPUS_API_KEY }} \
            --space=${{ env.OCTOPUS_SPACE }}
